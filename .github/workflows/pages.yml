name: Deploy website

on:
  push:
    branches: [ preview ]   # preview op GitHub Pages; main gaat live naar de VPS (deploy.yml)
  workflow_dispatch:      # handmatig starten mogelijk

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # De preview hoort niet in Google: alleen deze kopie krijgt noindex, darkesttimes.nl niet
      - name: Preview klaarzetten (noindex)
        run: |
          rsync -a --exclude='.git*' --exclude='.github' --exclude='server' --exclude='bronbestanden' --exclude='_site' ./ _site/
          find _site -name '*.html' -exec sed -i 's#<head>#<head>\n    <meta name="robots" content="noindex, nofollow">#' {} +

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
