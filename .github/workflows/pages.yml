name: Deploy website

on:
  push:
    branches: [ preview ]   # preview op GitHub Pages; main gaat live naar de VPS (deploy.yml)
  workflow_dispatch:      # handmatig starten mogelijk

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .  # hele repo (index.html + assets)

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
